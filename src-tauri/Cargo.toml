[package]
name = "pdfedit-app"
version = "0.11.3"
description = "pdfedit — PDFs bearbeiten, bis ins kleinste Detail"
edition = "2021"
license = "MIT"

[[bin]]
name = "pdfedit"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
